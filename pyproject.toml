[project]
name = "basics-of-ai-agh"
version = "1.0.0"
description = "Basics of Artificial Intelligence course at AGH"
authors = []
readme = "README.md"
requires-python = "==3.12.*"

dependencies = [
    # general
    "jupyter",
    "matplotlib",
    "numpy",
    "pandas>=3.0",
    "pre-commit",
    "scipy",
    # lab 1 - linear models
    "feature-engine>=1.9",
    "scikit-learn>=1.8",
    # lab 2 - classification, decision trees, ensembles
    "lightgbm==4.*",
    # lab 3 - neural networks
    "onnx",
    "onnxruntime",
    "onnxscript",
    "pyarrow",  # Parquet files
    "torch>=2.8.0",
    # lab 4 - computer vision
    "optuna>=4",
    "torchvision",
    # lab 5 - transformers, NLP
    "accelerate",
    "datasets>=3,<4",  # 4.0+ dropped loading scripts, used by clarin-pl/poquad
    "evaluate",
    "peft",
    "protobuf",
    "sacremoses",  # HerBERT tokenizer
    "sentencepiece",  # plT5 tokenizer
    "tensorboard",
    "transformers>=4.46,<5",  # 5.0 removed arguments used in lab 5
    # lab 6 - reinforcement learning
    "numba",
    # lab 7 - recommender systems
    "scikit-surprise>=1.1.4",
]

[tool.ruff]
extend-exclude = [
    # student notebooks are exercise templates, linting fixes (e.g. removing
    # unused imports or placeholders) would break them
    "lab*/lab_[0-9].ipynb",
    # solution fragments, using variables defined in the main notebooks
    "lab*/*_solution.ipynb",
    "lab*/*_solutions.ipynb",
    "lab5/solutions.py",
]

[tool.ruff.lint]
# explicit rules, so that ruff updates don't change what is checked:
# default rules, import sorting (I) and Python syntax upgrades (UP)
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# common and fine in notebooks: imports in later cells, redefining functions
# in later cells, unused variables like fig in "fig, ax = plt.subplots()",
# short variable names like l in comprehensions
"*.ipynb" = ["E402", "E741", "F811", "F841"]
